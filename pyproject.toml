[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-file-measurement-api"
version = "0.1.0"
description = "HTTP API that reads KML and Shapefile uploads and measures polygon areas and line lengths."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "geopandas>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "python-multipart>=0.0.9",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient still builds on httpx; the project's API tests use it as intended.
    "ignore:Using .httpx. with .starlette.testclient.:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "pandas.*", "pyogrio.*", "shapely.*"]
ignore_missing_imports = true
